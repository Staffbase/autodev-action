name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - 'main'
      - 'releases/*'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0

      - name: Install Dependencies
        run: mise run install

      - name: Build Action
        run: mise run all

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Execute Action
        uses: ./
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ secrets.DEV_PUSH_USER }}
          labels: true
          comments: true

  dependabot:
    needs: [build, test]
    uses: Staffbase/gha-workflows/.github/workflows/template_automerge_dependabot.yml@efb9ed918e1e6e918a9d42e11279b5624fb0a386 # v18.1.0
    with:
      force: true
    secrets:
      client_id: ${{ vars.STAFFBASE_ACTIONS_CLIENT_ID }}
      private_key: ${{ secrets.STAFFBASE_ACTIONS_PRIVATE_KEY }}
